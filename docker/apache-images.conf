# Uploaded files live under /var/www/html/images and must never be executed.
# Only script handlers are denied: images (and other static files) are still
# served normally, but a crafted .php/.phtml/.phar upload cannot run.
<Directory /var/www/html/images>
    <FilesMatch "\.(?i:php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
