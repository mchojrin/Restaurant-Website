; PHP settings for the Food Order app container.

; Log errors to the container's stderr (visible via `docker compose logs web`),
; but never print them into HTTP responses.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2

; The legacy page flow includes the admin header (HTML) before calling
; header('Location: ...') in several handlers. Buffer output so those redirects
; are not silently lost to "headers already sent".
output_buffering = On

; Image uploads are capped at 8 MB in the app's forms. post_max_size must be a
; little larger so the whole multipart request (form fields + file) fits.
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 20

memory_limit = 256M
expose_php = Off
